# 平台默认研究方向配置示例 – 少样本工业视觉异常检测（演示场景）
#
# 该配置演示如何为内置 ``fsad`` 预设加载演示数据集。
# 平台默认入口已经切换到 ``machine_vision_anomaly_detection``，
# 想要保留原始 FSAD 演示行为的用户可以显式引用本文件。
#
# 该 YAML 目前只作为文档与配置示例存在,不被运行时直接加载;
# 实际 ProjectSpec 由 API/前端根据用户输入构建。

title: 少样本工业视觉异常检测自主研究
domain: 少样本工业视觉异常检测
application_context: 新产品上线时仅能获取极少量正常样本
objective: 自主发现并验证具有科学价值的可证伪改进方向
preset: fsad

datasets:
  - name: MVTec AD
    role: primary
    normal_only_training: true
  - name: VisA
    role: validation
    normal_only_training: true

constraints:
  shots: [1, 2, 4, 8]
  no_real_anomalies_for_adaptation: true
  require_image_level_score: true
  require_pixel_localization: true
  training_free_preferred: true
  strict_k_shot_protocol: true
  pool_compression_protocol: true
  candidate_pool_size: 30

budget:
  gpu_hours: 12
  max_parallel_runs: 2
  max_llm_calls: 300
  max_experiments: 240
